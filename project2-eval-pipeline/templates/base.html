<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>{% block title %}大模型红队评测平台{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", sans-serif; margin: 0; background: #f4f6f9; color: #222; }
  header { background: #2c5f8a; color: #fff; padding: 14px 32px; display: flex; align-items: baseline; gap: 24px; }
  header h1 { font-size: 20px; margin: 0; }
  header a { color: #cfe1f0; text-decoration: none; font-size: 14px; }
  header a:hover { color: #fff; }
  main { max-width: 1000px; margin: 28px auto; padding: 0 16px; }
  .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 22px 26px; margin-bottom: 20px; }
  .card h2 { margin-top: 0; color: #2c5f8a; font-size: 18px; }
  label { display: block; margin: 8px 0; }
  input[type=text], input[type=number], select { padding: 6px 10px; border: 1px solid #c6cfd8; border-radius: 6px; font-size: 14px; }
  button { background: #2c5f8a; color: #fff; border: none; padding: 10px 28px; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #234e70; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border: 1px solid #e2e6eb; padding: 8px 10px; text-align: left; }
  th { background: #eef3f8; }
  .muted { color: #888; font-size: 13px; }
  .pill { padding: 2px 10px; border-radius: 10px; font-size: 12px; color: #fff; }
  .running { background: #f0ad4e; } .finished { background: #5cb85c; }
  .failed { background: #d9534f; } .unknown { background: #999; }
  progress { width: 100%; height: 18px; }
</style>
</head>
<body>
<header>
  <h1>🛡️ 大模型红队评测平台</h1>
  <a href="/">发起扫描</a>
  <a href="/history">历史任务</a>
  <a href="/compare">任务对比</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
